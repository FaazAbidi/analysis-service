version: "3.8"

services:
  # Redis service (message broker)
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction

  # Flask web application
  web:
    build: .
    command: gunicorn app:app --bind 0.0.0.0:8080 --reload --log-level debug
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
    volumes:
      - .:/app
    restart: unless-stopped

  # Celery worker
  worker:
    build: .
    command: celery --app tasks worker --loglevel info --concurrency 4
    depends_on:
      - redis
      - web
    environment:
      - CELERY_BROKER_URL=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  redis-data:
