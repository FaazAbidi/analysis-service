services:
  # Flask web service
  - type: web
    name: flask-celery-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    startCommand: gunicorn app:app
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: celery-queue
          property: connectionString

  # Celery worker
  - type: worker
    name: celery-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    startCommand: celery --app tasks worker --loglevel info --concurrency 4
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: celery-queue
          property: connectionString

  # Flower web UI for monitoring Celery
  - type: web
    name: flower-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    startCommand: celery flower --app tasks --loglevel info
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: celery-queue
          property: connectionString

  # Redis instance to act as message broker
  - type: redis
    name: celery-queue
    ipAllowList: # required
      - source: 0.0.0.0/0
        description: everywhere
    plan: starter # recommended for production
    maxmemoryPolicy: noeviction # recommended for queue use 